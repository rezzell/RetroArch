name: CI 3DS

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
  repository_dispatch:
    types: [run_build]

permissions:
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  choose-runner:
    uses: rezzell/.github/.github/workflows/choose-runner.yml@b16e70c8bd989dfb4c7c0f91728fdd813f0982ce
    with:
      organization: rezzell
      scale-set-name: galleon-runner-set
      fallback-runner: ubuntu-latest
    secrets:
      org-runners-read-token: ${{ secrets.ORG_RUNNERS_READ_TOKEN }}

  build:
    needs: choose-runner
    runs-on: ${{ fromJson(needs.choose-runner.outputs.runner) }}
    container: 
      image: reallibretroretroarch/libretro-build-devkitpro:latest
      options: --user root

    steps:
    - uses: taiki-e/checkout-action@v1
      with:
        ref: ${{ inputs.ref || github.event.client_payload.ref || github.ref }}
    
    - name: Compile Salamander
      run: |
        make -f Makefile.ctr.salamander -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 clean
        make -f Makefile.ctr.salamander -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1
    
    - name: Compile RA
      run: |
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 clean
        make -f Makefile.ctr -j$(getconf _NPROCESSORS_ONLN) USE_CTRULIB_2=1 HAVE_STATIC_DUMMY=1 info all
    - name: Get short SHA
      id: slug
      run: echo "::set-output name=sha8::$(echo ${GITHUB_SHA} | cut -c1-8)"

    - uses: actions/upload-artifact@v4
      with:
        name: retroarch-3ds-${{ steps.slug.outputs.sha8 }}
        path: |
          retroarch_3ds.3dsx
          retroarch_3ds.cia
          retroarch_3ds.smdh
          retroarch_3ds_salamander.3dsx
          retroarch_3ds_salamander.cia
          retroarch_3ds_salamander.smdh
